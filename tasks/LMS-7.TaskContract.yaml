apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: LMS-7
  title: "LMS6, part 1: the CMS's media bucket (cloudflare-r2-cms, from lumen-payload PC4)"
spec:
  goal: "A private R2 bucket for the CMS's media exists on stage and prod, and its wiring is published as WIRING_CLOUDFLARE_R2_CMS, before the CMS binds it."
  affects:
    - "infra/terraform/cloudflare-r2-cms/**"
    - "tasks/LMS-7.TaskContract.yaml"
  doneWhen:
    - "the PR's plan-only lanes for stage and prod are green"
    - "the merge's apply lanes for stage and prod are green and WIRING_CLOUDFLARE_R2_CMS is published on both environment rungs"
  gates:
    - "terraform validate and terraform fmt -check pass against the pinned providers"
    - "orun plan --changed for this diff plans only cloudflare-r2-cms, on stage and prod"
  secrets:
    - "CLOUDFLARE_R2_TOKEN"
    - "CLOUDFLARE_ACCOUNT_ID"
  envs:
    - "stage"
    - "prod"
