apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: cms
  description: Payload CMS on Cloudflare Workers — admin panel, REST and GraphQL over schema cms, through its own cache-disabled Hyperdrive config
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  # cloudflare-worker-turbo, not cloudflare-workers-assets-turbo: the assets
  # type has no wiring parameters, so it cannot bind a Hyperdrive config. A
  # wrangler config can declare `main` and `assets` itself, so the OpenNext
  # build (.open-next/worker.js + .open-next/assets) deploys on this type.
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/cms
  # Its own lane per environment (execution.lanes in intent.yaml): the Next.js
  # build is one of the longest jobs in a plan, and a shared lane would wait
  # on it.
  lane: isolated
  dependsOn:
    # ENFORCED ON MAIN: the CMS binds the config cloudflare-hyperdrive-cms
    # publishes and the bucket cloudflare-r2-cms publishes, and reads the
    # schema its migrations create, so all of them exist before it deploys. A
    # pull request deploys nothing, so nothing on one waits.
    - component: cloudflare-hyperdrive-cms
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: cloudflare-r2-cms
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: db-migrate
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  # Runtime secrets, pushed to the Worker by secrets-live after each deploy.
  #   PAYLOAD_SECRET   generated by cloudflare-hyperdrive-cms; nobody types it.
  #   CMS_SETUP_TOKEN  the owner's, and only if they want to open first-user
  #                    setup (docs/runbook.md). Unseeded = setup stays closed.
  #   WIRING_*         the published wiring of cloudflare-hyperdrive-cms and
  #                    cloudflare-r2-cms for each environment, read by
  #                    wire-live (deploy). Optional,
  #                    not required: it exists only after that component's
  #                    first apply on main, so a pull request that brings both
  #                    would otherwise fail secret resolution. A deploy still
  #                    cannot run without it: on main the apply runs first
  #                    (enforced dependsOn), and wire-live refuses an empty
  #                    wiring document.
  optionalSecretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_CMS_STAGE: "secret://org_1116c98ad8b6459694e495746d1eca14/multi-tenant-saas-2/stage/WIRING_CLOUDFLARE_HYPERDRIVE_CMS"
    WIRING_CLOUDFLARE_HYPERDRIVE_CMS_PROD: "secret://org_1116c98ad8b6459694e495746d1eca14/multi-tenant-saas-2/prod/WIRING_CLOUDFLARE_HYPERDRIVE_CMS"
    WIRING_CLOUDFLARE_R2_CMS_STAGE: "secret://org_1116c98ad8b6459694e495746d1eca14/multi-tenant-saas-2/stage/WIRING_CLOUDFLARE_R2_CMS"
    WIRING_CLOUDFLARE_R2_CMS_PROD: "secret://org_1116c98ad8b6459694e495746d1eca14/multi-tenant-saas-2/prod/WIRING_CLOUDFLARE_R2_CMS"
    PAYLOAD_SECRET: "secret://org_1116c98ad8b6459694e495746d1eca14/multi-tenant-saas-2/{{ .environment }}/CMS_PAYLOAD_SECRET"
    CMS_SETUP_TOKEN: "secret://org_1116c98ad8b6459694e495746d1eca14/multi-tenant-saas-2/{{ .environment }}/CMS_SETUP_TOKEN"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        env:
          CMS_URL: https://multi-tenant-saas-2-cms-stage.nexo-7be.workers.dev
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        env:
          CMS_URL: https://multi-tenant-saas-2-cms-prod.nexo-7be.workers.dev
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    orgName: sourceplane
    owner: sourceplane
    repo: multi-tenant-saas-2
    runtimeSecrets: "PAYLOAD_SECRET,CMS_SETUP_TOKEN"
    turboFilter: "@saas/cms"
    # wrangler.jsonc is rendered, never committed: from wiring.fixture.json on
    # verify lanes, from the published wiring on deploy lanes.
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-hyperdrive-cms,cloudflare-r2-cms"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    # Terraform owns every resource the bindings name (cloudflare-r2-cms,
    # cloudflare-hyperdrive-cms). Left on, wrangler reads the R2 bucket over
    # the R2 API before the upload, and the brokered workers-deploy token has
    # no R2 permission: "Authentication error [code: 10000]" on
    # /r2/buckets/<name>. The deploy step passes --x-provision=false.
    skipResourceProvisioning: true
    installCommand: pnpm install --frozen-lockfile
    # The CMS's suite (tests/cms) runs in this lane too: a change to apps/cms
    # alone does not mark cms-tests changed (dependsOn orders, it does not
    # propagate changes), and the stack's worker composition has no test step.
    buildCommand: pnpm exec turbo run build --filter=@saas/cms && pnpm --filter @saas/cms-tests test
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/cms
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    # Schema cms is migrations 200, 300, 301, 310 and 320 in packages/db,
    # applied by db-migrate (an enforced dependency above). The CMS never
    # migrates itself.
    migrationCommand: "echo 'Schema cms is applied by db-migrate (migrations 200_cms_payload_core, 300_lms_course_model, 301_lms_sample_academy, 310_lms_learner_records and 320_cms_media).'"
    # Live means: the database answers through HYPERDRIVE_CMS, the admin
    # panel renders, and the learner catalogue renders (its marker, not a
    # course title: an admin may unpublish the sample). Retried with backoff
    # by the composition.
    smokeCommand: "curl -fsS --max-time 30 \"${CMS_URL:?}/health\" | grep -q '\"db\":\"ok\"' && test \"$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \"${CMS_URL}/admin\")\" = 200 && curl -fsS --max-time 30 \"${CMS_URL}/\" | grep -q 'data-page=\"catalogue\"'"
  labels:
    team: platform
    layer: runtime
    surface: cms
    runtime: cloudflare
